name: Publish to npm

on:
    release:
        types: [published]
    workflow_dispatch:
        inputs:
            release_tag:
                description: Git tag to publish, for example v0.1.0.
                required: true
                type: string

permissions:
    contents: read
    id-token: write

jobs:
    publish:
        if: github.repository == 'Mantle-UI/mantle-icons'
        runs-on: ubuntu-latest
        env:
            RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.event.release.tag_name }}

        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ env.RELEASE_TAG }}
            - uses: actions/setup-node@v7
              with:
                  node-version: "22"
                  package-manager-cache: false
                  registry-url: https://registry.npmjs.org
            - run: npm install -g npm@latest
            - run: npm ci
            - name: Verify release version
              run: test "${RELEASE_TAG#v}" = "$(node -p "require('./package.json').version")"
            - run: npm run build
            - run: npm publish --access public --provenance
